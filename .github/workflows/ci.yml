name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Python syntax check (repo modules)
        run: |
          python -m compileall -q \
            models \
            tools \
            edge/health_monitor \
            edge/mqtt_bridge \
            export_tensorrt.py \
            tests

      - name: Validate YAML configs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("configs")
          files = list(root.rglob("*.yaml")) + list(root.rglob("*.yml"))
          assert files, "No config YAML found"
          for path in files:
              with path.open(encoding="utf-8") as f:
                  data = yaml.safe_load(f)
              assert data is not None, path
              print(f"OK  {path}")
          print(f"Validated {len(files)} config file(s)")
          PY

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
