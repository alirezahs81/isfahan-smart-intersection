intersection:
  id: "chaharbag_azadi"
  name_fa: "چهارباغ-آزادی"
  name_en: "ChaharBagh-Azadi"
  city: "Isfahan"
  coordinates: [32.6546, 51.6680]
  timezone: "Asia/Tehran"
  
  geometry:
    approach_north: "ChaharBagh_N"
    approach_south: "ChaharBagh_S"
    approach_east: "Azadi_E"
