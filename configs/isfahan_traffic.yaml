# YOLOv10-ISF Configuration برای ترافیک اصفهان
# کلاس‌ها: ۱۲ کلاس مخصوص ایران/اصفهان

path: ../data/synthetic  # dataset root dir
train: images/train      # train images (relative to 'path')
val: images/val          # val images (relative to 'path')
test: images/test        # test images (optional)

# Classes (12 classes for Isfahan traffic)
names:
  0: sedan_iran
  1: pickup_iran
  2: motorcycle_iran
  3: bus_brt
  4: bus_city
  5: truck_heavy
  6: van_transport
  7: bicycle
  8: pedestrian
  9: traffic_light
  10: traffic_sign
  11: crosswalk

nc: 12  # number of classes

# Training hyperparameters optimized for Isfahan traffic
train_cfg:
  epochs: 150
  patience: 30
  batch: 64
  imgsz: 640
  device: "0,1,2,3"  # 4x A100 80GB
  workers: 16
  
  # Optimizer
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  
  # Learning rate schedule
  warmup_epochs: 5
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  
  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5
  
  # Augmentation (heavy for synthetic->real transfer)
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 2.0
  perspective: 0.001
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.3
  
  # Advanced
  close_mosaic: 10
  amp: true
  fraction: 1.0
  profile: false
  freeze: null
  multi_scale: false
  
  # Validation
  val: true
  save_json: true  # for COCO evaluation
  save_hybrid: false
  conf: 0.001
  iou: 0.6
  max_det: 300
  half: true
  dnn: false
  plots: true
  save_period: 10
  
  # Project
  project: "runs/isfahan"
  name: "yolov10n_isfahan_v1"
  exist_ok: false
  seed: 42
  deterministic: true

# Model configuration
model:
  # YOLOv10-N (nano) for edge deployment
  # 2.3M params, ~1.8ms on Jetson Orin (TensorRT INT8)
  type: "yolov10n"
  pretrained: "yolov10n.pt"
  
  # Custom head for traffic
  nc: 12
  reg_max: 16  # DFL bins
  strides: [8, 16, 32]
  
  # Neck
  neck:
    type: "PAN"
    in_channels: [256, 512, 1024]
    out_channels: 256
    depth_mult: 0.33
    width_mult: 0.25
  
  # Head
  head:
    type: "YOLOv10Head"
    num_classes: 12
    reg_max: 16
    use_dfl: true

# Data augmentation pipeline specific to traffic
augmentation:
  # Weather augmentations (simulate Isfahan conditions)
  weather:
    enable: true
    fog_probability: 0.15
    rain_probability: 0.10
    dust_probability: 0.20
    night_probability: 0.15
  
  # Traffic-specific
  traffic:
    occlusion_probability: 0.3
    truncation_probability: 0.2
    motion_blur_probability: 0.15
    lens_flare_probability: 0.1

# Class weights (handle imbalance)
class_weights:
  sedan_iran: 1.0
  pickup_iran: 1.2
  motorcycle_iran: 1.5
  bus_brt: 2.0
  bus_city: 2.0
  truck_heavy: 2.5
  van_transport: 1.3
  bicycle: 2.0
  pedestrian: 1.8
  traffic_light: 3.0
  traffic_sign: 3.0
  crosswalk: 3.0

# Evaluation metrics
evaluation:
  metrics: ["mAP@0.5", "mAP@0.5:0.95", "mAP@0.75", "mAP_small", "mAP_medium", "mAP_large"]
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  per_class: true
  confusion_matrix: true
  pr_curve: true