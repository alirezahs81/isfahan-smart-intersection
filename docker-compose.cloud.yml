version: '3.8'

# Isfahan Smart Intersection - Cloud Stack (Kubernetes-ready)
# Services: API, ClickHouse, Grafana, MLflow, Model Registry, Digital Twin

services:
  # ============================================================
  # API Gateway - FastAPI + gRPC
  # ============================================================
  api-gateway:
    build:
      context: ./cloud/api
      dockerfile: Dockerfile
    container_name: isfahan-api-gateway
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_REGISTRY_URI=sqlite:///mlflow/mlflow.db
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=https://traffic.isfahan.municipality.ir
    volumes:
      - ./configs:/app/configs:ro
      - ./cloud/api:/app:ro
    ports:
      - "8000:8000"   # HTTP/REST
      - "8001:8001"   # gRPC
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # ClickHouse - Analytics Database
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: isfahan-clickhouse
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-isfahan}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./cloud/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # Grafana - Persian RTL Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: isfahan-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=traffic.isfahan.municipality.ir
      - GF_SERVER_ROOT_URL=https://traffic.isfahan.municipality.ir/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/isfahan-chaharbag-azadi.json
    volumes:
      - ./cloud/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./cloud/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    networks:
      - isfahan-network

  # ============================================================
  # MLflow - Model Registry & Experiment Tracking
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.0
    container_name: isfahan-mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root s3://isfahan-mlflow-artifacts
        --artifacts-destination s3://isfahan-mlflow-artifacts
    environment:
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    volumes:
      - mlflow-data:/mlflow
      - ./cloud/mlflow/mlflow.db:/mlflow/mlflow.db
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # MinIO - S3-compatible Artifact Store
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: isfahan-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # Digital Twin Service - 3D GS + SUMO
  # ============================================================
  digital-twin:
    build:
      context: ./models/digital_twin
      dockerfile: Dockerfile
    container_name: isfahan-digital-twin
    environment:
      - SUMO_NET=configs/sumo/isfahan_network.net.xml
      - GS_MODEL_PATH=/models/digital_twin/isfahan_gs.ply
      - CAMERA_POSES=configs/camera_calibration.yaml
      - SYNC_RATE=10
      - RENDER_WIDTH=1920
      - RENDER_HEIGHT=1080
    volumes:
      - ./models/digital_twin:/app:ro
      - ./configs:/app/configs:ro
      - ./data/pretrained:/models:ro
    ports:
      - "8080:8080"  # REST API
      - "8081:8081"  # WebSocket for live view
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - isfahan-network

  # ============================================================
  # Alert Manager - Webhook Processing
  # ============================================================
  alert-manager:
    build:
      context: ./cloud/alert_manager
      dockerfile: Dockerfile
    container_name: isfahan-alert-manager
    environment:
      - WEBHOOK_PORT=9093
      - ALERT_RULES_PATH=/app/rules
      - NOTIFICATION_CHANNELS=email,sms,telegram,slack
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SLACK_WEBHOOK=${SLACK_WEBHOOK}
    volumes:
      - ./cloud/alert_manager/rules:/app/rules:ro
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
    networks:
      - isfahan-network

  # ============================================================
  # PostgreSQL - Metadata & Config Store
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: isfahan-postgres
    environment:
      - POSTGRES_DB=isfahan_traffic
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C.UTF-8
    volumes:
      - ./cloud/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d isfahan_traffic"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # Redis - Caching & Session Store
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: isfahan-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - isfahan-network

  # ============================================================
  # Prometheus - Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: isfahan-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./cloud/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks:
      - isfahan-network

  # ============================================================
  # Loki - Log Aggregation
  # ============================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: isfahan-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./cloud/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks:
      - isfahan-network

# ============================================================
# Networks
# ============================================================
networks:
  isfahan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================
# Volumes
# ============================================================
volumes:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:
  mlflow-data:
  minio-data:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data: